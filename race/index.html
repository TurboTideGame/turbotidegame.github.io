<script>
// A CHALLENGE A FRIEND link. With TurboTide on the phone this page never
// shows: the link opens the game (iPhone: universal link, this folder in
// .well-known/apple-app-site-association; Android: app link). Without it, the
// friend goes straight to the store for their phone (Alex 2026-10-31: no
// website in between). The run rides after "#", which never reaches a server.
(function () {
  var APP_STORE = "https://apps.apple.com/app/id6816707770";
  // Google Play's listing, once it's public ("" = Android isn't out yet).
  var PLAY_STORE = "";
  var ua = navigator.userAgent || "";
  var android = /Android/i.test(ua);
  if (android && !PLAY_STORE) {
    return;
  }
  location.replace(android ? PLAY_STORE : APP_STORE);
})();
</script>
